steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--platform', 'linux/amd64', '-t', 'gcr.io/$PROJECT_ID/gcp-app-backend:$COMMIT_SHA', '.']

  # Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gcp-app-backend:$COMMIT_SHA']

  # Deploy the service to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'gcp-app-backend' # Your service name
      - '--image'
      - 'gcr.io/$PROJECT_ID/gcp-app-backend:$COMMIT_SHA'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--project'
      - 'gcp-app-464623'  # Your Project ID - hardcoding to avoid variable substitution issues
      - '--set-env-vars'  # Set environment variables
      - 'GOOGLE_CLIENT_ID=$_GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET=$_GOOGLE_CLIENT_SECRET,NODE_ENV=production,GEMINI_API_KEY=$_GEMINI_API_KEY'

substitutions:
    _GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    _GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    _GEMINI_API_KEY: ${GEMINI_API_KEY}

options:
  logging: CLOUD_LOGGING_ONLY
